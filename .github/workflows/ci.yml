# SETUP-02: CI pipeline - build + test on every PR.
# Plain-language explanation: docs/ci.md

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you start a run by hand from the Actions tab

permissions:
  contents: read # read the code
  checks: write # let the test-report step add a "Test results" check with details

# If you push again to the same PR, cancel the older run that is still going.
# Runs on main are never cancelled: every merge keeps its own result (Definition of Done: "CI green on main").
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # This name is selected as the required status check in branch protection.
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests
        run: mvn --batch-mode --no-transfer-progress verify

      # The steps below run even if the build or a test failed (but not if the run was cancelled).
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          check_name: Test results
          include_passed: true
          detailed_summary: true

      - name: Upload raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.sha }}
          path: "**/target/surefire-reports/"
          if-no-files-found: warn
          retention-days: 30
